<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>TORO Navi by Salmon</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
        }
        
        @supports (-webkit-touch-callout: none) {
            body {
                height: calc(100vh - env(keyboard-inset-height, 0px));
                height: calc(100dvh - env(keyboard-inset-height, 0px));
            }
        }
        
        #map-container {
            position: relative;
            flex-grow: 1;
            display: flex;
            overflow: visible;
            width: 100%;
            height: 100%;
        }
        #map {
            position: absolute;
            background-color: #e4e4e4;
            transform-origin: center center;
            will-change: transform;
            transition: transform 0.2s ease-out;
        }
        .leaflet-marker-icon.tracked-player {
            z-index: 1000 !important;
        }
        .leaflet-marker-icon {
            transform-origin: center center;
        }
        #player-controls {
            padding: 8px;
            background-color: rgba(233, 233, 233, 0.95);
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            position: absolute;
            top: max(5px, env(safe-area-inset-top, 5px));
            left: max(5px, env(safe-area-inset-left, 5px));
            right: max(5px, env(safe-area-inset-right, 5px));
            z-index: 1000;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            font-size: 14px;
        }
        #player-controls label {
            font-weight: bold;
            white-space: nowrap;
        }
        #trackPlayerButton {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            min-height: 36px;
        }
        #trackPlayerButton:hover {
            background-color: #45a049;
        }
        #show-all-players-label {
            margin-left: auto;
        }
        .player-input {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 120px;
            background-color: white;
            min-height: 20px;
        }
        #road-panel {
            position: absolute;
            top: max(5px, env(safe-area-inset-top, 5px));
            right: max(5px, env(safe-area-inset-right, 5px));
            width: 35%;
            max-width: 250px;
            height: 25%;
            max-height: 100px;
            background-color: rgba(0,0,0,0.75);
            border-radius: 8px;
            padding: 12px;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            color: white;
            font-size: 24px;
        }
        #road-panel .road-text {
            color: white;
            font-weight: bold;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }
        #info-panel {
            display: none;
            position: absolute;
            bottom: max(5px, env(safe-area-inset-bottom, 5px));
            right: max(5px, env(safe-area-inset-right, 5px));
            background-color: rgba(255, 255, 255, 0.95);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 1000;
            font-size: 14px;
            max-width: 300px;
        }
        #info-panel h2 {
            margin: 0 0 10px;
            font-size: 18px;
        }
        #info-panel h3 {
            margin: 10px 0 5px;
            font-size: 16px;
        }
        #info-panel p {
            margin: 5px 0;
        }
        #info-panel ul {
            margin: 0;
            padding-left: 20px;
        }
        #status-message-area {
            margin-top: 10px;
            font-size: 12px;
        }
        .status-message {
            color: #333;
        }
        .error-message {
            color: #ff4444;
        }
        @media screen and (max-width: 768px) {
            body {
                height: 100vh;
                height: 100dvh;
                position: fixed;
                overflow: hidden;
            }
            #player-controls {
                padding: 6px;
                gap: 6px;
                font-size: 12px;
                flex-direction: column;
                align-items: stretch;
                top: max(2px, env(safe-area-inset-top, 2px));
                left: max(2px, env(safe-area-inset-left, 2px));
                right: max(2px, env(safe-area-inset-right, 2px));
            }
            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                align-items: center;
                width: 100%;
            }
            #player-controls label {
                font-size: 12px;
                margin-right: 4px;
            }
            .player-input {
                font-size: 12px;
                padding: 6px;
                min-width: 100px;
                flex: 1;
                min-height: 16px;
            }
            #trackPlayerButton {
                font-size: 12px;
                padding: 6px 12px;
                min-height: 32px;
                white-space: nowrap;
            }
            #show-all-players-label {
                margin-left: 0;
                margin-top: 4px;
                align-self: flex-start;
            }
            #show-labels-label {
                margin-top: 4px;
            }
            #road-panel {
                width: 35%;
                height: 15%;
                top: max(2px, env(safe-area-inset-top, 2px));
                right: max(2px, env(safe-area-inset-right, 2px));
                padding: 8px;
            }
            #road-panel .road-text {
                font-size: 12px;
            }
            #info-panel {
                max-width: 90%;
                font-size: 12px;
            }
            #info-panel h2 {
                font-size: 16px;
            }
            #info-panel h3 {
                font-size: 14px;
            }
        }
        @media screen and (max-width: 480px) {
            body {
                height: calc(100vh - 60px);
                height: calc(100dvh - 20px);
                min-height: -webkit-fill-available;
            }
            #player-controls {
                top: max(10px, env(safe-area-inset-top, 10px));
                left: max(2px, env(safe-area-inset-left, 2px));
                right: max(2px, env(safe-area-inset-right, 2px));
                padding: 4px;
                gap: 4px;
            }
            .player-input {
                font-size: 11px;
                padding: 4px;
                min-height: 14px;
            }
            #trackPlayerButton {
                font-size: 11px;
                padding: 4px 8px;
                min-height: 28px;
            }
            #player-controls label {
                font-size: 11px;
            }
            #road-panel {
                width: 40%;
                height: 12%;
                top: max(10px, env(safe-area-inset-top, 10px));
                right: max(2px, env(safe-area-inset-right, 2px));
                padding: 6px;
            }
            #road-panel .road-text {
                font-size: 11px;
            }
            #info-panel {
                font-size: 11px;
            }
            #info-panel h2 {
                font-size: 14px;
            }
            #info-panel h3 {
                font-size: 12px;
            }
        }
        @media screen and (max-width: 768px) and (-webkit-min-device-pixel-ratio: 1) {
            body {
                height: calc(100vh - 56px);
                height: calc(100dvh - 10px);
            }
            #player-controls {
                top: 15px;
            }
        }
        #tracking-controls {
            position: absolute;
            bottom: max(5px, env(safe-area-inset-bottom, 5px));
            left: max(5px, env(safe-area-inset-left, 5px));
            z-index: 1000;
            gap: 10px;
            align-items: center;
        }
        .tracking-btn {
            width: 80px;
            height: 80px;
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }
        .tracking-btn:hover {
            background-color: rgba(255, 255, 255, 1);
            transform: scale(1.05);
        }
        .tracking-btn:active {
            transform: scale(0.95);
        }
        .tracking-btn img {
            width: 65px;
            height: 65px;
            object-fit: contain;
        }
        .tracking-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .tracking-btn.disabled:hover {
            transform: none;
            background-color: rgba(255, 255, 255, 0.95);
        }
        .tracking-btn.active {
            background-color: rgba(76, 175, 80, 0.9);
            border: 2px solid #4CAF50;
        }
        #player-select-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            max-width: 300px;
            width: 90%;
            max-height: 400px;
            overflow-y: auto;
        }
        .modal-header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
        }
        .player-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .player-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background-color 0.2s ease;
        }
        .player-item:hover {
            background-color: #f5f5f5;
        }
        .player-item:last-child {
            border-bottom: none;
        }
        .player-avatar {
            width: 24px;
            height: 24px;
            border-radius: 2px;
        }
        .close-modal {
            background-color: #ff4444;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        @media screen and (max-width: 768px) {
            #tracking-controls {
                bottom: max(10px, env(safe-area-inset-bottom, 10px));
                left: max(10px, env(safe-area-inset-left, 10px));
                gap: 8px;
            }
            .tracking-btn {
                width: 44px;
                height: 44px;
            }
            .tracking-btn img {
                width: 28px;
                height: 28px;
            }
        }
        @media screen and (max-width: 480px) {
            #tracking-controls {
                bottom: max(15px, env(safe-area-inset-bottom, 15px));
                left: max(8px, env(safe-area-inset-left, 8px));
                gap: 6px;
            }
            .tracking-btn {
                width: 40px;
                height: 40px;
            }
            .tracking-btn img {
                width: 24px;
                height: 24px;
            }
        }
        .leaflet-tooltip.dynmap-marker-label,
        .leaflet-tooltip.player-label {
            background-color: transparent;
            border: none;
            box-shadow: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            text-shadow: 1px 1px 2px black, -1px -1px 2px black, 1px -1px 2px black, -1px 1px 2px black;
            white-space: nowrap;
            padding: 0;
            margin: 0;
            pointer-events: none;
            transform-origin: center bottom;
            display: block !important;
            text-align: center;
        }
        .leaflet-tooltip.hidden-label {
            display: none !important;
        }
        .leaflet-tooltip.dynmap-marker-label::before,
        .leaflet-tooltip.player-label::before,
        .leaflet-tooltip.dynmap-marker-label::after,
        .leaflet-tooltip.player-label::after {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="map-container">
        <div id="map">
            <div class="loading-message">マップデータを読み込み中...</div>
        </div>
        <div id="info-panel">
            <h2>TORO Navi by Salmon</h2>
            <p>追跡中のプレイヤー: <span id="tracked-player-name">-</span></p>
            <p>プレイヤー座標 (Dynmap): <span id="player-dynmap-coords">-</span></p>
            <p>ワールド: <span id="player-world">-</span></p>
            <p>走行中の道路: <span id="current-road">-</span></p>
            <h3>近くの施設:</h3>
            <ul id="nearby-facilities">
                <li>プレイヤーを追跡していません。</li>
            </ul>
            <div id="status-message-area" class="status-message"></div>
        </div>
        <div id="tracking-controls">
            <button id="player-select-btn" class="tracking-btn" title="プレイヤーを選択">
                <img src="user.png" alt="プレイヤー選択">
            </button>
            <button id="tracking-toggle-btn" class="tracking-btn disabled" title="追跡開始/停止">
                <img src="icon.png" alt="追跡">
            </button>
        </div>
        <div id="player-select-modal">
            <div class="modal-content">
                <div class="modal-header">プレイヤーを選択</div>
                <ul id="modal-player-list" class="player-list">
                    <li class="player-item">プレイヤーを読み込み中...</li>
                </ul>
                <button class="close-modal" onclick="closePlayerSelectModal()">キャンセル</button>
            </div>
        </div>
    </div>
    <div id="road-panel" style="display:none;">
        <div class="road-text">現在の道路: <span id="current-road">-</span></div>
    </div>
    <script src="script.js" defer></script>
    <script>
    </script>
</body>
</html>
